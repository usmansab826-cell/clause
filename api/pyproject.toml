[project]
name = "api"
version = "0.1.0"
description = "Clause Shop RAG assistant API"
readme = "README.md"
authors = [
    { name = "Rizwan", email = "rizwanse66@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.162.0",
    "google-genai>=2.34.0",
    "langchain>=1.4.7",
    "langchain-community>=0.4.2",
    "langchain-google-genai>=4.4.2",
    "langchain-text-splitters>=1.1.3",
    "pydantic>=2.14.2",
    "python-dotenv>=1.2.4",
]

[tool.fastapi]
entrypoint = "app.main:app"
